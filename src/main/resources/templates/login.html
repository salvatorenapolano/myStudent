<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - myStudent</title>

    <!-- Custom CSS (include già i font) -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="login-wrapper">
    <!-- Login Container -->
    <div class="login-container">
        <!-- Left Side - Branding -->
        <div class="login-left">
            <div class="login-pattern"></div>
            <div class="login-branding">
                <h1>myStudent</h1>
                <p>La piattaforma digitale per gestire il tuo percorso scolastico in modo semplice e intuitivo.</p>
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="login-right">
            <div class="login-form-wrapper">
                <div class="login-header">
                    <h2>Accedi</h2>
                    <p>Inserisci le tue credenziali per accedere.</p>
                </div>

                <form th:action="@{/login}" method="POST" class="login-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <!-- Username -->
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">person</span>
                            <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-input"
                                    placeholder="Inserisci il tuo username"
                                    required
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">lock</span>
                            <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-input"
                                    placeholder="Inserisci la tua password"
                                    required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                        </div>
                    </div>

                    <!-- Messaggio di errore -->
                    <div th:if="${param.error}">
                        <p style="color: red;">Username o password errati!</p>
                    </div>

                    <!-- Messaggio logout -->
                    <div th:if="${param.logout}">
                        <p style="color: green;">Logout effettuato con successo!</p>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-large btn-full">
                        <span>Accedi</span>
                    </button>

                    <!-- Sign Up Link -->
                    <div class="form-text">
                        <span class="form-text-secondary">Non hai un account?</span>
                        <a th:href="@{/register}" class="form-link">Crea un account</a>
                    </div>
                </form>

                <!-- Description -->

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer style="margin-top: 2rem; padding: 1rem 0;">
        <div class="footer-content">
            <p>&copy; 2025 myStudent</p>
        </div>
    </footer>
</div>

<!-- JavaScript -->
<script th:src="@{/js/script.js}"></script>
</body>
</html>
